<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PIN — Gastos en Pareja</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body { background: linear-gradient(135deg, #1a1f2e 0%, #2d3555 100%); min-height: 100vh; display:flex; align-items:center; justify-content:center; }
    .pin-wrap { max-width: 360px; width: 100%; padding: 1rem; }
    .pin-title { color:#fff; font-size:1.4rem; font-weight:800; text-align:center; margin-bottom:.25rem; }
    .pin-sub { color:rgba(255,255,255,.55); text-align:center; font-size:.9rem; margin-bottom:2rem; }
    .pin-avatar { width:72px; height:72px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:2rem; margin:0 auto 1rem; }
    .pin-inputs { display:flex; gap:12px; justify-content:center; margin-bottom:1.5rem; }
    .pin-digit {
      width: 56px; height: 64px;
      text-align: center; font-size: 1.6rem; font-weight: 700;
      border: 2px solid rgba(255,255,255,.2); border-radius: 12px;
      background: rgba(255,255,255,.08); color: #fff;
      outline: none; transition: border-color .2s;
      -webkit-text-security: disc;
    }
    .pin-digit:focus { border-color: #4f8ef7; background: rgba(79,142,247,.15); }
    .pin-numpad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:240px; margin:0 auto 1.5rem; }
    .pin-key {
      height: 58px; border-radius: 12px;
      background: rgba(255,255,255,.1); border: 1.5px solid rgba(255,255,255,.15);
      color: #fff; font-size: 1.3rem; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, transform .1s; user-select: none;
    }
    .pin-key:active { background: rgba(79,142,247,.4); transform: scale(.95); }
    .pin-key.pin-del { font-size: 1rem; }
    .pin-key.pin-ok { background: #4f8ef7; border-color: #4f8ef7; font-size:.95rem; }
    .pin-key.pin-ok:active { background: #3a75e0; }
    .pin-dots { display:flex; gap:12px; justify-content:center; margin-bottom:1.5rem; }
    .pin-dot { width:14px; height:14px; border-radius:50%; border:2px solid rgba(255,255,255,.4); background:transparent; transition:background .15s; }
    .pin-dot.filled { background:#4f8ef7; border-color:#4f8ef7; }
  </style>
</head>
<body>
<div class="pin-wrap">
  <div class="pin-avatar" style="background:{{ usuario.color }}22; color:{{ usuario.color }}">
    <i class="bi bi-{{ usuario.emoji }}"></i>
  </div>
  <div class="pin-title">Hola, {{ usuario.nombre }}</div>
  <p class="pin-sub"><i class="bi bi-lock me-1"></i>Introduce tu PIN de 4 digitos</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <div class="alert alert-{{ category }} py-2 text-center mb-3" style="font-size:.88rem">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  <!-- Puntos indicadores -->
  <div class="pin-dots" id="pinDots">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
  </div>

  <!-- Formulario oculto -->
  <form id="pinForm" method="POST" action="{{ url_for('pin_usuario', uid=usuario.id) }}">
    <input type="hidden" name="pin" id="pinHidden">
  </form>

  <!-- Teclado numerico -->
  <div class="pin-numpad">
    {% for n in [1,2,3,4,5,6,7,8,9] %}
    <button type="button" class="pin-key" onclick="pinPress('{{ n }}')">{{ n }}</button>
    {% endfor %}
    <button type="button" class="pin-key pin-del" onclick="pinDel()"><i class="bi bi-delete"></i></button>
    <button type="button" class="pin-key" onclick="pinPress('0')">0</button>
    <button type="button" class="pin-key pin-ok" onclick="pinSubmit()"><i class="bi bi-check-lg"></i></button>
  </div>

  <div class="text-center">
    <a href="{{ url_for('seleccionar_usuario') }}" style="color:rgba(255,255,255,.45); font-size:.82rem; text-decoration:none;">
      <i class="bi bi-arrow-left me-1"></i>Volver
    </a>
  </div>
</div>

<script>
let pin = '';
function pinPress(n) {
  if (pin.length >= 4) return;
  pin += n;
  updateDots();
  if (pin.length === 4) setTimeout(pinSubmit, 200);
}
function pinDel() {
  pin = pin.slice(0, -1);
  updateDots();
}
function updateDots() {
  for (let i = 0; i < 4; i++) {
    document.getElementById('d' + i).classList.toggle('filled', i < pin.length);
  }
}
function pinSubmit() {
  if (pin.length !== 4) return;
  document.getElementById('pinHidden').value = pin;
  document.getElementById('pinForm').submit();
}
document.addEventListener('keydown', e => {
  if (e.key >= '0' && e.key <= '9') pinPress(e.key);
  else if (e.key === 'Backspace') pinDel();
  else if (e.key === 'Enter') pinSubmit();
});
</script>
</body>
</html>

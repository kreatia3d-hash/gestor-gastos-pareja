<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seleccionar usuario — Gastos en Pareja</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="background: linear-gradient(135deg, #1a1f2e 0%, #2d3555 100%); min-height: 100vh; display:flex; align-items:center; justify-content:center;">
<div style="max-width: 480px; width: 100%; padding: 1.25rem;">
  <div style="color:#fff; font-size:1.7rem; font-weight:800; text-align:center; margin-bottom:.3rem;">
    <i class="bi bi-heart-half text-danger me-2"></i>Gastos en Pareja
  </div>
  <p style="color:rgba(255,255,255,.55); text-align:center; font-size:.9rem; margin-bottom:2rem;">
    Selecciona quien eres para continuar
  </p>
  <div class="row g-3">
    {% for u in usuarios %}
    <div class="col-6">
      <a href="{{ url_for('set_usuario', uid=u.id) }}" class="user-select-card" style="border-color:{{ u.color }};">
        <div class="user-avatar" style="background:{{ u.color }}22; color:{{ u.color }}">
          <i class="bi bi-{{ u.emoji }}"></i>
        </div>
        <div class="user-name" style="color:{{ u.color }}">{{ u.nombre }}</div>
        {% if u.pin %}
        <div class="mt-2" style="color:rgba(255,255,255,.4); font-size:.75rem;">
          <i class="bi bi-lock-fill me-1"></i>PIN requerido
        </div>
        {% endif %}
      </a>
    </div>
    {% endfor %}
  </div>
  <p style="color:rgba(255,255,255,.25); text-align:center; font-size:.75rem; margin-top:1.5rem;">
    Los datos se comparten entre ambos usuarios
  </p>
</div>
</body>
</html>
